services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_PATH: /app/data/smart_factory.db
      SMOP_DB_PATH: /app/data/smart_factory.db
      ARTIFACTS_DIR: /app/models
      SMOP_MODEL_DIR: /app/models
      LOG_LEVEL: INFO
    volumes:
      - smop-data:/app/data
      - smop-models:/app/models
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      DATABASE_PATH: /app/data/smart_factory.db
      SMOP_DB_PATH: /app/data/smart_factory.db
      ARTIFACTS_DIR: /app/models
      SMOP_MODEL_DIR: /app/models
      LOG_LEVEL: INFO
    volumes:
      - smop-data:/app/data
      - smop-models:/app/models
      - ./reports:/app/reports
      - ./assets:/app/assets
    ports:
      - "8501:8501"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  smop-data:
  smop-models:
