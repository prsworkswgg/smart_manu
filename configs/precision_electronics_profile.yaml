project:
  name: smart-manufacturing-ai-operations-platform
  profile_name: precision_electronics_profile
  profile_version: 1.0.0
  data_policy: simulated_data_only
  description: Precision-electronics-inspired simulated manufacturing profile for portfolio use.

runtime:
  timezone: Asia/Bangkok
  random_seed: 42
  default_shift: A
  simulation_mode: realtime

storage:
  database_type: sqlite
  sqlite_path: database/smart_manufacturing.db

api:
  base_url: http://127.0.0.1:8000
  health_endpoint: /health
  sensor_endpoint: /ingest/sensor-reading
  production_endpoint: /ingest/production-event
  batch_endpoint: /ingest/batch
  timeout_seconds: 10

factory:
  site_id: SIM_PRECISION_SITE_01
  site_name: Simulated Precision Electronics Site
  product_family: precision_electronics_components
  lines:
    - line_id: LINE_A
      line_name: Precision Assembly Line A
      target_throughput_per_hour: 780
      stations:
        - station_id: ST_PRESS_01
          station_name: Micro Press Station
          machine_id: MTR_PRESS_01
          machine_type: micro_press
          criticality: high
        - station_id: ST_SPINDLE_01
          station_name: Spindle Test Station
          machine_id: MTR_SPINDLE_01
          machine_type: spindle_tester
          criticality: high
        - station_id: ST_THERMAL_01
          station_name: Thermal Inspection Station
          machine_id: MTR_THERMAL_01
          machine_type: thermal_chamber
          criticality: medium
        - station_id: ST_FINAL_01
          station_name: Final Inspection Station
          machine_id: MTR_FINAL_01
          machine_type: optical_inspection
          criticality: medium
    - line_id: LINE_B
      line_name: Precision Assembly Line B
      target_throughput_per_hour: 720
      stations:
        - station_id: ST_PRESS_02
          station_name: Micro Press Station
          machine_id: MTR_PRESS_02
          machine_type: micro_press
          criticality: high
        - station_id: ST_SPINDLE_02
          station_name: Spindle Test Station
          machine_id: MTR_SPINDLE_02
          machine_type: spindle_tester
          criticality: high
        - station_id: ST_FINAL_02
          station_name: Final Inspection Station
          machine_id: MTR_FINAL_02
          machine_type: optical_inspection
          criticality: medium

sensor_ranges:
  air_temperature:
    unit: celsius
    normal_min: 22.0
    normal_max: 32.0
    warning_min: 18.0
    warning_max: 38.0
  process_temperature:
    unit: celsius
    normal_min: 35.0
    normal_max: 78.0
    warning_min: 25.0
    warning_max: 95.0
  vibration_rms:
    unit: mm_per_sec
    normal_min: 0.3
    normal_max: 3.0
    warning_min: 0.1
    warning_max: 6.5
  vibration_peak:
    unit: mm_per_sec
    normal_min: 1.0
    normal_max: 9.0
    warning_min: 0.3
    warning_max: 18.0
  pressure:
    unit: kpa
    normal_min: 95.0
    normal_max: 145.0
    warning_min: 75.0
    warning_max: 180.0
  torque:
    unit: newton_meter
    normal_min: 8.0
    normal_max: 42.0
    warning_min: 3.0
    warning_max: 65.0
  rotational_speed:
    unit: rpm
    normal_min: 1200
    normal_max: 4200
    warning_min: 700
    warning_max: 5200
  motor_current:
    unit: ampere
    normal_min: 2.0
    normal_max: 14.0
    warning_min: 0.5
    warning_max: 22.0
  power_consumption:
    unit: kw
    normal_min: 0.8
    normal_max: 8.5
    warning_min: 0.2
    warning_max: 13.0
  tool_wear:
    unit: percent
    normal_min: 0.0
    normal_max: 72.0
    warning_min: 0.0
    warning_max: 100.0
  operating_hours:
    unit: hour
    normal_min: 0.0
    normal_max: 5000.0
  production_load:
    unit: ratio
    normal_min: 0.55
    normal_max: 1.10
  ambient_humidity:
    unit: percent
    normal_min: 35.0
    normal_max: 70.0
    warning_min: 20.0
    warning_max: 85.0

production_ranges:
  cycle_time_sec:
    normal_min: 3.5
    normal_max: 8.0
    warning_max: 14.0
  throughput_count:
    normal_min: 8
    normal_max: 16
  station_yield:
    normal_min: 0.965
    normal_max: 0.998
    warning_min: 0.92
  reject_count:
    normal_min: 0
    normal_max: 2
  rework_count:
    normal_min: 0
    normal_max: 3
  defect_rate:
    normal_min: 0.002
    normal_max: 0.035
    warning_max: 0.08
  micro_stop_count:
    normal_min: 0
    normal_max: 3
    warning_max: 8
  downtime_minutes:
    normal_min: 0.0
    normal_max: 2.0
    warning_max: 15.0
  wip_count:
    normal_min: 10
    normal_max: 80
  queue_length:
    normal_min: 0
    normal_max: 35
  inspection_score_proxy:
    normal_min: 0.90
    normal_max: 0.995
  process_stability_index:
    normal_min: 0.82
    normal_max: 0.995

causal_model:
  tool_wear:
    base_increment_per_hour: 0.035
    load_multiplier: 0.060
    high_temperature_multiplier: 0.025
  torque:
    base_by_machine_type:
      micro_press: 18.0
      spindle_tester: 24.0
      thermal_chamber: 10.0
      optical_inspection: 8.0
    tool_wear_coefficient: 0.22
    load_coefficient: 7.5
  motor_current:
    base_ampere: 4.5
    torque_coefficient: 0.18
    vibration_coefficient: 0.35
  vibration:
    base_rms: 0.75
    tool_wear_coefficient: 0.030
    speed_imbalance_coefficient: 0.00035
  cycle_time:
    base_seconds: 4.8
    vibration_coefficient: 0.42
    queue_pressure_coefficient: 0.018
  micro_stops:
    vibration_threshold: 3.2
    cycle_time_threshold: 7.5
    extra_stops_when_unstable: 3
  quality:
    inspection_score_from_vibration: -0.018
    inspection_score_from_temperature: -0.004
    defect_rate_from_low_score: 0.12
    yield_from_defect_rate: -0.85
  maintenance_reset:
    tool_wear_reset_ratio: 0.35
    vibration_reset_ratio: 0.55
    current_reset_ratio: 0.70

data_quality_injection:
  enabled: true
  global_probability: 0.025
  issue_probabilities:
    missing_value: 0.004
    duplicate_timestamp: 0.003
    timestamp_gap: 0.004
    sensor_dropout: 0.004
    stuck_sensor: 0.003
    sensor_drift: 0.003
    extreme_outlier: 0.002
    wrong_unit: 0.001
    late_reading: 0.001

ml:
  failure_classification:
    target: failure_label
    preferred_model: random_forest_classifier
    fallback_model: gradient_boosting_classifier
    alert_threshold: 0.65
    high_risk_threshold: 0.80
  rul_regression:
    target: rul_estimate_hours
    preferred_model: random_forest_regressor
    fallback_model: gradient_boosting_regressor
    low_rul_threshold_hours: 24
  anomaly_detection:
    preferred_model: isolation_forest
    contamination: 0.04
    alert_score_threshold: -0.12
  split:
    strategy: time_aware
    test_fraction: 0.20

dashboard:
  default_line_id: LINE_A
  refresh_seconds: 5
  disclaimer: Simulated data only. Not real Seagate or proprietary factory data.
